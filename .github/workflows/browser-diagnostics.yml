name: Supported Chromium writer QA diagnostics
on:
  push:
    paths:
      - '.github/workflows/browser-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run synthetic authenticated Chromium
        env:
          TEST_ADMIN_CODE: TestOnlyPilot2026SecureLogin32CharactersABC
        run: python tests/test_pilot_real_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-chromium-screenshots
          path: /tmp/writer-browser-artifacts/
