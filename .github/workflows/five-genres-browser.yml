name: Five-genre real-browser acceptance
on:
  pull_request:
    paths:
      - "tests/test_all_genres_browser.py"
      - "app/**"
      - ".github/workflows/five-genres-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and Chromium
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Five real browser flows with synthetic projects
        run: python tests/test_all_genres_browser.py
